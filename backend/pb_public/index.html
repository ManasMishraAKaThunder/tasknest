<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskNest Backend API</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 450px; border: 1px solid #334155; }
    h1 { color: #38bdf8; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.6; }
    .status { display: inline-block; padding: 4px 12px; background: rgba(34, 197, 94, 0.2); color: #4ade80; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; }
    a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #0284c7; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; }
    a:hover { background: #0369a1; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #e2e8f0; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">● Service Online</div>
    <h1>TaskNest Backend API</h1>
    <p>The backend service is running.</p>
    <p>REST API endpoints are active under <code>/api/</code>.</p>
    <a href="/_/">Open Admin Dashboard</a>
  </div>
</body>
</html>
