services:
  - type: web
    name: tasknest-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npx tsx src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /opt/render/project/src/backend/pb_data
      - key: SOLARCH_JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    disk:
      name: solarch-data
      mountPath: /opt/render/project/src/backend/pb_data
      sizeGB: 1
